<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#F2F4F6; --paper-raised:#FFFFFF; --ink:#14213D; --ink-soft:#4A5568; --ink-faint:#8590A6;
    --line:#DCE1E7; --line-strong:#C3CAD3;
    --done:#2F6F4E; --done-bg:#E7F1EA; --progress:#A6631B; --progress-bg:#FBEEE1;
    --pending:#9C3D3D; --pending-bg:#F8EAE9; --planned:#1E4E8C; --planned-bg:#E8EEF6;
    --carried:#6B7280; --carried-bg:#EDEEF0;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased; }
  h1,h2,h3 { font-family:"Fraunces",Georgia,serif; margin:0; }
  .wrap { max-width:880px; margin:0 auto; padding:3rem 1.5rem 5rem; }
  .eyebrow { font-family:"IBM Plex Mono",monospace; font-size:.8rem; color:var(--ink-faint); letter-spacing:.02em; margin-bottom:.6rem; }
  header h1 { font-size:2.35rem; font-weight:600; letter-spacing:-.01em; }
  header p.sub { margin:.6rem 0 0; color:var(--ink-soft); max-width:62ch; }

  .filter { position:sticky; top:0; z-index:5; background:var(--paper); padding:1rem 0 .9rem; margin-top:1.5rem; border-bottom:1px solid var(--line-strong); }
  .filter .label { font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--ink-faint); letter-spacing:.04em; margin-bottom:.5rem; }
  .chips { display:flex; flex-wrap:wrap; gap:.5rem; }
  .chip-btn { font:inherit; font-size:.88rem; font-weight:500; color:var(--ink-soft); background:var(--paper-raised); border:1px solid var(--line-strong); border-radius:100px; padding:.4rem .95rem; cursor:pointer; }
  .chip-btn small { font-size:.72rem; color:var(--ink-faint); margin-left:.35rem; font-weight:400; }
  .chip-btn:hover { border-color:var(--ink); }
  .chip-btn.active { background:var(--ink); color:#fff; border-color:var(--ink); }
  .chip-btn.active small { color:#C9D2DE; }
  .chip-btn:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }

  .day { margin-top:2.75rem; }
  .day-head { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:.5rem; }
  .day-head h2 { font-size:1.6rem; font-weight:600; }
  .kind { font-family:"IBM Plex Mono",monospace; font-size:.72rem; letter-spacing:.05em; padding:.2rem .6rem; border-radius:100px; }
  .kind.Summary { background:var(--done-bg); color:var(--done); }
  .kind.Planned { background:var(--planned-bg); color:var(--planned); }
  .kind.Update { background:var(--done-bg); color:var(--done); }
  .summary { display:flex; border:1px solid var(--line); border-radius:4px; overflow:hidden; margin:1rem 0 0; background:var(--paper-raised); }
  .summary .stat { flex:1; padding:.85rem 1.1rem; border-right:1px solid var(--line); }
  .summary .stat:last-child { border-right:none; }
  .summary .num { font-family:"Fraunces",serif; font-size:1.6rem; font-weight:600; line-height:1; }
  .summary .lbl { font-size:.78rem; color:var(--ink-soft); margin-top:.3rem; }
  .summary .closed .num { color:var(--done); } .summary .notstarted .num { color:var(--planned); } .summary .done .num { color:var(--done); } .summary .progress .num { color:var(--progress); }
  .summary .pending .num { color:var(--pending); } .summary .planned .num { color:var(--planned); }

  .person { margin-top:2rem; }
  .person-head { border-bottom:1px solid var(--line-strong); padding-bottom:.5rem; margin-bottom:1rem; }
  .person-head h3 { font-size:1.2rem; font-weight:600; }
  .grp, .meta, .none { break-inside:avoid; }
  .task { border-left:3px solid var(--line-strong); background:var(--paper-raised); border-top:1px solid var(--line); border-right:1px solid var(--line); border-bottom:1px solid var(--line); border-radius:0 3px 3px 0; padding:.9rem 1.15rem; margin-bottom:.65rem; }
  .task.s-done { border-left-color:var(--done); } .task.s-progress { border-left-color:var(--progress); }
  .task.s-pending { border-left-color:var(--pending); } .task.s-planned, .task.s-notstarted { border-left-color:var(--planned); }
  .task.s-closed { border-left-color:var(--done); }
  .task.s-standing { border-left-color:var(--carried); }
  .task-top { display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; }
  .task-title { font-weight:600; font-size:.97rem; }
  .pill { flex-shrink:0; font-size:.7rem; font-weight:600; padding:.2rem .55rem; border-radius:100px; white-space:nowrap; }
  .pill.done { background:var(--done-bg); color:var(--done); } .pill.progress { background:var(--progress-bg); color:var(--progress); }
  .pill.pending { background:var(--pending-bg); color:var(--pending); } .pill.planned, .pill.notstarted { background:var(--planned-bg); color:var(--planned); }
  .pill.closed { background:var(--done-bg); color:var(--done); }
  .pill.standing { background:var(--carried-bg); color:var(--carried); }
  .rows { margin-top:.45rem; font-size:.9rem; }
  .row { display:flex; gap:.5rem; margin-top:.2rem; }
  .row .k { flex-shrink:0; width:5.6rem; color:var(--ink-faint); font-size:.78rem; padding-top:.1rem; }
  .row .v { color:var(--ink-soft); }
  .row .v a { color:var(--planned); text-decoration:none; font-weight:600; }
  .row .v a:hover { text-decoration:underline; }
  .grp { margin-top:1.1rem; }
  .grp-head { display:flex; align-items:center; gap:.6rem; margin-bottom:.55rem; }
  .grp-head .gname { font-family:"IBM Plex Mono",monospace; font-size:.74rem; letter-spacing:.06em; font-weight:500; }
  .grp-head .gcount { font-size:.74rem; color:var(--ink-faint); }
  .grp.closed .gname { color:var(--done); } .grp.progress .gname { color:var(--progress); } .grp.notstarted .gname { color:var(--planned); }
  .meta { font-size:.82rem; color:var(--ink-soft); margin:-.4rem 0 .2rem; }
  .meta b { color:var(--ink); font-weight:600; }
  .none { font-size:.88rem; color:var(--ink-faint); font-style:italic; margin-top:.8rem; }
  footer { margin-top:3.5rem; padding-top:1.25rem; border-top:1px solid var(--line); font-size:.8rem; color:var(--ink-faint); }

  @media (max-width:600px) {
    .wrap { padding:2rem 1.1rem 4rem; } header h1 { font-size:1.85rem; }
    .summary { flex-direction:column; } .summary .stat { border-right:none; border-bottom:1px solid var(--line); } .summary .stat:last-child { border-bottom:none; }
    .row { flex-direction:column; gap:.1rem; } .row .k { width:auto; }
  }
  @media print {
    html, body { background:var(--paper); -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .wrap { padding:1.2rem 1.2rem 1.5rem; max-width:100%; }
    .filter { display:none; }
    .day { display:block !important; margin-top:1.6rem; }
    .day + .day { break-before:page; page-break-before:always; }
    .task, .summary { break-inside:avoid; page-break-inside:avoid; }
    .person-head, .day-head { break-after:avoid; page-break-after:avoid; }
    .person { margin-top:1.2rem; } .task { margin-bottom:.45rem; padding:.7rem 1rem; }
    footer { display:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1>Daily Tracker</h1>
    <p class="sub">Pick a date. Each person shows what closed and what is still in progress.</p>
  </header>

  <div class="filter">
    <div class="label">FILTER BY DATE</div>
    <div class="chips" id="chips"></div>
  </div>

  <main id="app"></main>

  <footer>
    To add a day, copy a block in the DAYS list at the bottom of this file and change the date and tasks. Or send Claude the next day's notes.
  </footer>
</div>

<script>
/* ============================================================
   DATA. To update the tracker, edit this list.
   For each person, three groups: closed, progress, notstarted.
   A task is [title, rows]. rows are [label, text] pairs.
   Text containing PROD-1234 becomes a Jira link.
   ============================================================ */
const JIRA = "https://canaryai.atlassian.net/browse/";
const NAMES = ["Sumit & Aditi","Abhishek","Nikita","Chetan","Rushi"];
const DAYS = [
 { date:"2026-10-06", short:"Tue 6 Oct", long:"Tuesday, 6 Oct 2026", people:{
  "Sumit & Aditi":{ closed:[["GAuth and code review changes for E-Verify",[["Landed","Completed 6 Oct."]]]],
    progress:[["Custom email templates for other companies",[["Context","Only Care Advantage was done so far."],["Due","Feature closure by DEV, Aditi and Sumit: 7 Oct EOD."]]]], notstarted:[] },
  "Abhishek":{ closed:[["GAuth delivery: E-Verify",[["Landed","Completed 6 Oct."]]]],
    progress:[["Test the deployment pipeline",[["Due","Closure 6 Oct EOD, 8 PM IST."]]],["Vertex AI build",[["Status","DEV picked it up on 6 Oct."]]]],
    notstarted:[["GAuth delivery: all other products",[["Status","Rest all pending. I9 is next."]]],["QA bug fixes: Dashboard, SuperAdmin, then Retention",[["Status","Not picked yet."]]]] },
  "Nikita":{ closed:[],
    progress:[["CR requests from U.S. team",[["Ticket","PROD-3529"],["Status","6 done as of 6 Oct, deployment pending."],["Next","2 estimated to be fixed and deployed by 9 Oct."]]],["Respond to Proliant",[["Status","Waiting on feedback from the Proliant team. Latest outbound: 6 Oct."]]]],
    notstarted:[["Code review",[["Ticket","PROD-3594"],["Condition","Picked in Sprint 21 only after Proliant and the CRs from U.S. team are done."]]]] },
  "Chetan":{ closed:[],
    progress:[["Jira management",[]],["Test Remote I9, to UAT",[]]], notstarted:[] },
  "Rushi":{ closed:[],
    progress:[["Vertex AI build",[["Status","As of 6 Oct, 7:00 PM IST only I9 is complete."],["Blocked on","Abhishek's approval that the change works, before other products."]]],["Env vs action Excel for each product",[["Purpose","Future clarity on what runs where."]]]], notstarted:[] }
 }},
 { date:"2026-10-07", short:"Wed 7 Oct", long:"Wednesday, 7 Oct 2026", people:{
  "Sumit & Aditi":{ closed:[["Custom email templates for other companies",[["Landed","Code complete and DEV testing done on 7 Oct."],["Note","Sunil has a new ask."]]]], progress:[], notstarted:[] },
  "Abhishek":{ closed:[["GAuth delivery: Retention",[["Landed","Completed 7 Oct."]]],["GAuth delivery: Canary Dashboard",[["Landed","Completed 7 Oct."]]],["SuperAdmin QA bugs",[["Landed","5 bugs fixed on 7 Oct."]]]],
    progress:[["GAuth delivery: I9",[["Blocked on","Could not deliver. Failures while deploying."]]],["Vertex AI build",[["Status","One final closure step pending. It can only be done after I9 is deployed to UAT."],["Missed","7 Oct 2:00 PM IST deadline, due to the deployment failure."]]],["Test the deployment pipeline",[["Status","Approval was given on a success scenario, but it started failing again on 7 Oct."],["Impact","Hampered delivery dates."]]]],
    notstarted:[["QA bug fixes: Dashboard and Retention",[["Status","Not picked yet."]]]] },
  "Nikita":{ closed:[],
    progress:[["CR requests from U.S. team",[["Ticket","PROD-3529"],["Status","DEV worked primarily on resolving these tasks on 7 Oct."]]]], notstarted:[] },
  "Chetan":{ leave:true, closed:[], progress:[], notstarted:[] },
  "Rushi":{ closed:[],
    progress:[["Vertex AI build",[["Status","Infra's share of work is near closure. Only a sync activity is required."]]],["Deployment pipeline for I9",[]]], notstarted:[] }
 }},
 { date:"2026-10-08", short:"Thu 8 Oct", long:"Thursday, 8 Oct 2026", tag:"EVENING UPDATE", people:{
  "Sumit & Aditi":{ jira:"Aditi and Sumit: time logging and status updates done.",
    closed:[["Custom email template feature",[["Landed","Delivered to Sunil."]]]],
    progress:[["Remote I9 bugs logged by QA",[["Pending","1 P2 pending from Aditi and Sumit."],["Also open","1 P1 sits with Abhishek: Go to Dashboard SSO."]]]],
    notstarted:[["GAuth and code review changes for I9",[["Due","To be delivered to UAT on the morning of 9 Oct, by 2 PM IST."],["Earlier","Not picked on 8 Oct because of the deployment failure."]]],["New ask from Sunil: invite on phone number only, no email",[["Timeline","Vague. Code complete by Tuesday EOD (13 Oct) for QA."],["Effort","DEV needs 5 hrs."]]]] },
  "Abhishek":{ jira:"All tasks up to date on Jira.", closed:[],
    progress:[["Remote I9 bug: Go to Dashboard SSO",[["Priority","P1, pending from Abhishek's end."]]],["SuperAdmin bugs",[["Due","Bugs still pending on Abhishek's side need full closure by Friday, 9 Oct EOD."],["Moved","Bugs that fall in Sumit's court are picked up in Sprint 22."]]]],
    notstarted:[["Dashboard bugs",[["Status","Not picked."]]]] },
  "Nikita":{ jira:"Pending.",
    closed:[["CR requests from U.S. team, logged before 7 Oct",[["Ticket","PROD-3529"],["Landed","All of those are closed."]]]],
    progress:[["CR request raised by Sunil",[["Ticket","PROD-3529"],["Status","1 pending."]]],["Respond to Proliant",[["Status","Everything is falling in place. DEV has captured no issues or concerns."],["Needs","Webhook and webhook integration, and their next step, need a green signal from DEV and a final call on delivery from Robert."],["Timeline","This stretches to Sprint 22."],["Note","The India team got the first update on the 28 Sept query on the morning of 8 Oct. DEV introduced no blocker or delay."]]]],
    notstarted:[["Code review",[["Ticket","PROD-3594"],["Scope","DEV selected the review tasks that fit the 16 hr estimate for Sprint 21."],["Condition","Picked up only if there is no priority item in the plan."]]]] },
  "Chetan":{ jira:"Pending.", closed:[],
    progress:[["Jira management",[]],["Email template testing",[]],["Test Remote I9, to UAT",[["Bugs","As of 8 Oct, 80 logged and 75 solved."]]]], notstarted:[] },
  "Rushi":{ jira:"All tasks up to date on Jira.",
    closed:[["Deployment pipeline for I9: plan expiry issues",[["Landed","Fixed."]]],["Set up AWS Session Manager, SOC2 compliant",[["For","Nikita.DEV and Piyushh.DEV."],["Landed","Closed."],["Pending","Testing from DEV."]]]],
    progress:[["Excel for Vertex AI build",[]]],
    notstarted:[["Deployment pathway across the product suite",[["Scope","Plan and exercise the deployment pathway for every product."],["Effort","DEV needs 40 to 50 hrs, in Sprint 22."]]]] }
 }}
];
const STANDING = [
 { name:"Sumit & Aditi", items:["I9 in Onboarding, picked up after I9 Remote delivery","UI for key generation"] },
 { name:"Abhishek", items:["Take over the Retention-Prediction portfolio","GAuth and code review delivery: 5 Oct, 6 Oct, 9 Oct","Retention and Tax Agent to code complete"] },
 { name:"Nikita", items:["Proliant release","Plan for Applicant flow","Indeed, make it work for UAT (separate from PROD-3591), Sprint 22"] },
 { name:"Chetan", items:["Work towards code review and Google Auth fixes release (not to be picked up today)"] },
 { name:"Rushi", items:["Security controls","Demo phone numbers for testing"] }
];
const GROUPS = [["closed","CLOSED"],["progress","IN PROGRESS"],["notstarted","NOT STARTED"]];
const PILL = { closed:"Closed", progress:"In progress", notstarted:"Not started" };

/* ===================== rendering ===================== */
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const linkify = v => esc(v).replace(/PROD-\d+/g, m => `<a href="${JIRA}${m}" target="_blank" rel="noopener">${m}</a>`);
const card = (t, st, rows, pill) => `<div class="task s-${st}"><div class="task-top"><div class="task-title">${esc(t)}</div><span class="pill ${st}">${pill}</span></div>` +
  (rows && rows.length ? `<div class="rows">${rows.map(r => `<div class="row"><div class="k">${esc(r[0])}</div><div class="v">${linkify(r[1])}</div></div>`).join('')}</div>` : '') + `</div>`;

function personHTML(name, p) {
  const total = p.closed.length + p.progress.length + p.notstarted.length;
  let h = `<div class="person"><div class="person-head"><h3>${esc(name)}</h3></div>`;
  if (p.jira) h += `<div class="meta"><b>Jira:</b> ${esc(p.jira)}</div>`;
  if (p.leave) return h + `<div class="none">On leave.</div></div>`;
  if (!total) return h + `<div class="none">No update reported.</div></div>`;
  GROUPS.forEach(([k, label]) => {
    if (!p[k].length) return;
    h += `<div class="grp ${k}"><div class="grp-head"><span class="gname">${label}</span><span class="gcount">${p[k].length}</span></div>` +
         p[k].map(t => card(t[0], k, t[1], PILL[k])).join('') + `</div>`;
  });
  return h + `</div>`;
}
function dayHTML(d) {
  const cnt = k => NAMES.reduce((n, nm) => n + d.people[nm][k].length, 0);
  const stats = GROUPS.map(([k, label]) => `<div class="stat ${k}"><div class="num">${cnt(k)}</div><div class="lbl">${PILL[k]}</div></div>`).join('');
  return `<section class="day" data-key="${d.date}"><div class="day-head"><h2>${d.long}</h2><span class="kind Update">${d.tag || 'DAY UPDATE'}</span></div>
    <div class="summary">${stats}</div>${NAMES.map(nm => personHTML(nm, d.people[nm])).join('')}</section>`;
}
function standingHTML() {
  return `<section class="day" data-key="standing"><div class="day-head"><h2>Rest of week and standing items</h2><span class="kind Planned">STANDING</span></div>
    ${STANDING.map(p => `<div class="person"><div class="person-head"><h3>${esc(p.name)}</h3></div>${p.items.map(i => card(i, 'standing', [], 'Standing')).join('')}</div>`).join('')}</section>`;
}
document.getElementById('app').innerHTML = DAYS.map(dayHTML).join('') + standingHTML();

const chips = [{key:'all', label:'All dates'}].concat(DAYS.map(d => ({key:d.date, label:d.short}))).concat([{key:'standing', label:'Standing'}]);
const chipBox = document.getElementById('chips');
chipBox.innerHTML = chips.map(c => `<button class="chip-btn" data-key="${c.key}">${c.label}</button>`).join('');
function show(key) {
  document.querySelectorAll('.chip-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  document.querySelectorAll('.day').forEach(s => { s.style.display = (key === 'all' || s.dataset.key === key) ? '' : 'none'; });
  const d = DAYS.find(x => x.date === key);
  document.getElementById('eyebrow').textContent = d ? d.long.toUpperCase() : (key === 'standing' ? 'STANDING ITEMS' : 'ALL DATES');
  if (history.replaceState) history.replaceState(null, '', '#' + key);
}
chipBox.addEventListener('click', e => { const b = e.target.closest('.chip-btn'); if (b) show(b.dataset.key); });
const start = location.hash.slice(1);
show(chips.some(c => c.key === start) ? start : DAYS[DAYS.length - 1].date);
</script>
</body>
</html>
