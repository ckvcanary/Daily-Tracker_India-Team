  header p.sub { margin:.6rem 0 0; color:var(--soft); max-width:62ch; }

  /* filter */
  .filter { position:sticky; top:0; z-index:20; background:var(--paper); padding:1rem 0 .9rem; margin-top:1.5rem; border-bottom:1px solid var(--line2); }

  .frow { display:flex; flex-wrap:wrap; align-items:center; gap:.6rem; }
  .ddwrap { position:relative; }
  .ddbtn { display:inline-flex; align-items:center; gap:.65rem; min-width:15.5rem; background:var(--raised); border:1px solid var(--line2); border-radius:8px; padding:.55rem .85rem; color:var(--ink); font-size:.95rem; font-weight:500; text-align:left; }
  .ddbtn:hover, .ddbtn[aria-expanded="true"] { border-color:var(--ink); }
  .ddbtn svg { flex-shrink:0; color:var(--soft); }
  .ddbtn .lab { flex:1; }
  .ddbtn .lab.muted { color:var(--faint); font-weight:400; }
  .ddbtn .chev { transition:transform .15s; } .ddbtn[aria-expanded="true"] .chev { transform:rotate(180deg); }
  .ddpanel { position:absolute; left:0; top:calc(100% + .4rem); z-index:30; width:min(24rem,92vw); max-height:min(26rem,70vh); overflow:auto; background:var(--raised); border:1px solid var(--line2); border-radius:10px; box-shadow:0 14px 40px rgba(20,33,61,.18); padding:.5rem .5rem .9rem; }
  .ddpanel[hidden] { display:none; }
  .ddall { display:block; width:100%; text-align:left; border:none; background:transparent; padding:.55rem .7rem; border-radius:6px; font-weight:600; font-size:.92rem; color:var(--ink); }
  .ddall:hover { background:var(--paper); } .ddall.on { background:var(--ink); color:#fff; }
  .ddyear { font-family:"Fraunces",Georgia,serif; font-size:1.05rem; font-weight:600; padding:.8rem .7rem .15rem; border-top:1px solid var(--line); margin-top:.45rem; }
  .ddmonth { font-family:"IBM Plex Mono",monospace; font-size:.72rem; letter-spacing:.05em; color:var(--faint); text-transform:uppercase; padding:.5rem .7rem .3rem; }
  .ddgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(3.6rem,1fr)); gap:.4rem; padding:0 .5rem; }
  .ddday { display:flex; flex-direction:column; align-items:center; gap:0; border:1px solid var(--line2); background:var(--raised); border-radius:8px; padding:.35rem 0; color:var(--ink); line-height:1.15; }
  .ddday b { font-size:1rem; font-weight:600; } .ddday span { font-size:.68rem; color:var(--faint); }
  .ddday:hover { border-color:var(--ink); }
  .ddday.on { background:var(--ink); border-color:var(--ink); color:#fff; } .ddday.on span { color:#C9D2DE; }
  .pagebtn { font-size:.9rem; font-weight:500; color:var(--soft); background:var(--raised); border:1px solid var(--line2); border-radius:8px; padding:.55rem 1rem; }
  .pagebtn:hover { border-color:var(--ink); color:var(--ink); }
  .pagebtn.on { background:var(--ink); border-color:var(--ink); color:#fff; }

  /* deployments marked for the day, highlighted at the top */
  .dep { margin-top:1.4rem; background:#FFF6DC; border:1.5px solid #E2B84A; border-left:6px solid #C98A00; border-radius:8px; padding:1rem 1.2rem 1.1rem; box-shadow:0 2px 10px rgba(201,138,0,.12); }
  .dep-head { display:flex; flex-wrap:wrap; align-items:center; gap:.7rem; }
  .dep-tag { font-family:"IBM Plex Mono",monospace; font-size:.72rem; letter-spacing:.06em; font-weight:500; background:#C98A00; color:#fff; padding:.22rem .65rem; border-radius:100px; }
  .dep-head b { font-family:"Fraunces",Georgia,serif; font-size:1.15rem; font-weight:600; color:#5A3A0C; }
  .dep-grid { display:grid; gap:.6rem; margin-top:.85rem; }
  .dep-item { display:flex; gap:.9rem; align-items:flex-start; background:#fff; border:1px solid #EBD79A; border-radius:6px; padding:.7rem .9rem; }
  .dep-env { flex-shrink:0; min-width:3.4rem; text-align:center; font-size:.74rem; font-weight:600; letter-spacing:.04em; padding:.3rem .55rem; border-radius:6px; margin-top:.1rem; }
  .prio-group { font-family:"IBM Plex Mono",monospace; font-size:.74rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:#1E4E8C; margin:.5rem 0 -.05rem; }
  .dep-env.Test { background:var(--plan-bg); color:var(--plan); }
  .dep-env.UAT { background:var(--plan-bg); color:var(--plan); } .dep-env.Prod { background:var(--done-bg); color:var(--done); }
  .dep-title { font-weight:600; font-size:.97rem; }
  .dep-meta { margin-top:.15rem; font-size:.84rem; color:var(--soft); display:flex; flex-wrap:wrap; gap:.2rem 1.2rem; }
  .dep-meta b { font-weight:600; color:var(--ink); }
  .dep-note { margin-top:.2rem; font-size:.82rem; color:var(--faint); }

  .dep-env.TBC { background:var(--carry-bg); color:var(--carry); }
  /* items on priority for the day */

  .dep-env.TBC { background:var(--carry-bg); color:var(--carry); }
  .prio { margin-top:1rem; background:#EEF3FA; border:1.5px solid #9DB4D6; border-left:6px solid #1E4E8C; border-radius:8px; padding:1rem 1.2rem 1.1rem; box-shadow:0 2px 10px rgba(30,78,140,.10); }
  .prio-tag { font-family:"IBM Plex Mono",monospace; font-size:.72rem; letter-spacing:.06em; font-weight:500; background:#1E4E8C; color:#fff; padding:.22rem .65rem; border-radius:100px; }
  .prio .dep-head b { color:#14213D; }
  .prio-list { display:grid; gap:.55rem; margin-top:.85rem; }
  .prio-item { display:flex; gap:.9rem; align-items:flex-start; background:#fff; border:1px solid #C9D6EA; border-radius:6px; padding:.65rem .9rem; }
  .prio-num { flex-shrink:0; width:1.7rem; height:1.7rem; border-radius:50%; background:#1E4E8C; color:#fff; font-weight:600; font-size:.82rem; display:flex; align-items:center; justify-content:center; margin-top:.05rem; }

  .sprintstrip { display:inline-flex; flex-wrap:wrap; align-items:center; gap:.5rem .9rem; margin-top:1.1rem; padding:.45rem .9rem; background:var(--raised); border:1px solid var(--line2); border-radius:100px; font-size:.86rem; color:var(--soft); }
  .sprintstrip b { font-family:"Fraunces",Georgia,serif; font-size:1rem; color:var(--ink); }
  .sprintstrip .dot { width:.55rem; height:.55rem; border-radius:50%; background:var(--done); display:inline-block; }
  .sprintbadge { font-family:"IBM Plex Mono",monospace; font-size:.7rem; letter-spacing:.04em; padding:.2rem .6rem; border-radius:100px; background:var(--carry-bg); color:var(--carry); margin-right:.4rem; }
  .headtags { display:flex; align-items:center; }
  .ampm { display:inline-flex; border:1px solid var(--line2); border-radius:100px; overflow:hidden; background:var(--raised); margin-right:.55rem; }
  .amb { border:none; background:transparent; font-family:"IBM Plex Mono",monospace; font-size:.78rem; font-weight:600; letter-spacing:.06em; padding:.28rem .95rem; color:var(--soft); cursor:pointer; }
  .amb.on { background:var(--ink); color:#fff; }
  .amb:not(.on):hover { background:var(--paper); color:var(--ink); }
  .amb:focus-visible { outline:2px solid var(--ink); outline-offset:-2px; }

  .ddleg { display:flex; flex-wrap:wrap; gap:.3rem .9rem; padding:.45rem .7rem .2rem; font-size:.74rem; color:var(--soft); }
  .ddleg i { display:inline-block; width:.7rem; height:.28rem; border-radius:2px; margin-right:.35rem; vertical-align:middle; }

  .plansel { display:flex; align-items:center; gap:.5rem; margin-top:1rem; flex-wrap:wrap; }
  .navb { width:2.2rem; height:2.2rem; border-radius:50%; border:1px solid var(--line2); background:var(--raised); font-size:1.15rem; line-height:1; color:var(--ink); padding:0 0 .12rem; }
  .navb:hover:not(:disabled) { border-color:var(--ink); } .navb:disabled { opacity:.35; cursor:default; }
  .plansel .ddbtn { min-width:17rem; } .plansel .ddbtn .lab b { font-family:"Fraunces",Georgia,serif; font-size:1.02rem; margin-right:.35rem; } .plansel .ddbtn .lab span { color:var(--soft); font-weight:400; font-size:.86rem; }
  .plansel .ddpanel { width:min(26rem,92vw); }
  .ddsearch { width:calc(100% - .4rem); margin:.1rem .2rem .5rem; font:inherit; font-size:.9rem; padding:.5rem .7rem; border:1px solid var(--line2); border-radius:6px; background:var(--paper); color:var(--ink); }
  .ddsearch:focus { outline:2px solid var(--ink); outline-offset:1px; background:#fff; }
  .plansp { display:grid; grid-template-columns:1fr auto; gap:.1rem .8rem; width:100%; text-align:left; border:none; background:transparent; padding:.55rem .7rem; border-radius:6px; color:var(--ink); }
  .plansp:hover { background:var(--paper); } .plansp.on { background:var(--ink); color:#fff; }
  .plansp b { font-weight:600; font-size:.92rem; } .plansp span { font-size:.76rem; color:var(--faint); } .plansp.on span { color:#C9D2DE; }
  .plansp em { grid-row:1 / span 2; grid-column:2; align-self:center; font-style:normal; font-size:.68rem; font-family:"IBM Plex Mono",monospace; letter-spacing:.04em; padding:.15rem .55rem; border-radius:100px; background:var(--carry-bg); color:var(--carry); }
  .plansp em.Current { background:var(--done-bg); color:var(--done); } .plansp em.Upcoming { background:var(--plan-bg); color:var(--plan); }
  .plannone { padding:.8rem .7rem; font-size:.86rem; color:var(--faint); font-style:italic; }

  /* days */
  .day { margin-top:2.75rem; }
  .day-head { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.6rem; }
  .day-head h2 { font-size:1.6rem; font-weight:600; }
  .kind { font-family:"IBM Plex Mono",monospace; font-size:.72rem; letter-spacing:.05em; padding:.2rem .6rem; border-radius:100px; }
  .kind.Update { background:var(--done-bg); color:var(--done); } .kind.Plan { background:var(--plan-bg); color:var(--plan); }
  .lead { margin:.7rem 0 0; color:var(--soft); font-size:.92rem; max-width:70ch; }
  .summary { display:flex; border:1px solid var(--line); border-radius:4px; overflow:hidden; margin-top:1rem; background:var(--raised); }
  .summary .stat { flex:1; padding:.85rem 1.1rem; border-right:1px solid var(--line); } .summary .stat:last-child { border-right:none; }
  .summary .num { font-family:"Fraunces",serif; font-size:1.6rem; font-weight:600; line-height:1; }
  .summary .lbl { font-size:.78rem; color:var(--soft); margin-top:.3rem; }
  .summary .closed .num { color:var(--done); } .summary .progress .num { color:var(--prog); } .summary .notstarted .num, .summary .plan .num { color:var(--plan); }
  .person { margin-top:2rem; }
  .person-head { border-bottom:1px solid var(--line2); padding-bottom:.5rem; margin-bottom:1rem; }
  .person-head h3 { font-size:1.2rem; font-weight:600; }
  .meta { font-size:.82rem; color:var(--soft); margin:-.4rem 0 .2rem; } .meta b { color:var(--ink); font-weight:600; }
  .grp { margin-top:1.1rem; }
  .grp-head { display:flex; align-items:center; gap:.6rem; margin-bottom:.55rem; }
  .gname { font-family:"IBM Plex Mono",monospace; font-size:.74rem; letter-spacing:.06em; font-weight:500; } .gcount { font-size:.74rem; color:var(--faint); }
  .grp.closed .gname { color:var(--done); } .grp.progress .gname { color:var(--prog); } .grp.notstarted .gname, .grp.plan .gname { color:var(--plan); }
  .none { font-size:.88rem; color:var(--faint); font-style:italic; margin-top:.8rem; }
  .task { border-left:3px solid var(--line2); background:var(--raised); border-top:1px solid var(--line); border-right:1px solid var(--line); border-bottom:1px solid var(--line); border-radius:0 3px 3px 0; padding:.9rem 1.15rem; margin-bottom:.65rem; }
  .task.s-closed { border-left-color:var(--done); } .task.s-progress { border-left-color:var(--prog); }
  .task.s-notstarted, .task.s-plan { border-left-color:var(--plan); } .task.s-standing { border-left-color:var(--carry); }
  .task-top { display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; }
  .task-title { font-weight:600; font-size:.97rem; }
  .pill { flex-shrink:0; font-size:.7rem; font-weight:600; padding:.2rem .55rem; border-radius:100px; white-space:nowrap; }
  .pill.closed { background:var(--done-bg); color:var(--done); } .pill.progress { background:var(--prog-bg); color:var(--prog); }
  .pill.notstarted, .pill.plan { background:var(--plan-bg); color:var(--plan); } .pill.standing { background:var(--carry-bg); color:var(--carry); }
  .since { margin-top:.3rem; font-size:.8rem; color:var(--carry); }
  .since b { font-weight:600; color:var(--ink); }
  .rows { margin-top:.45rem; font-size:.9rem; }
  .row { display:flex; gap:.5rem; margin-top:.2rem; }
  .row .k { flex-shrink:0; width:5.6rem; color:var(--faint); font-size:.78rem; padding-top:.1rem; }
  .row .v { color:var(--soft); overflow-wrap:anywhere; }
  .row .v a, .task-title a { color:var(--plan); text-decoration:none; font-weight:600; } .row .v a:hover, .task-title a:hover { text-decoration:underline; }

  .effctl { display:flex; flex-wrap:wrap; gap:.8rem; margin-top:1rem; }
  .seg { display:inline-flex; border:1px solid var(--line2); border-radius:100px; overflow:hidden; background:var(--raised); }
  .segb { border:none; background:transparent; font-size:.85rem; font-weight:500; color:var(--soft); padding:.4rem 1.05rem; } .segb.on { background:var(--ink); color:#fff; }
  .effmeta { margin-top:.9rem; font-size:.86rem; color:var(--soft); }
  .effgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:1rem; margin-top:1.1rem; }
  .effcard { background:var(--raised); border:1px solid var(--line); border-radius:6px; padding:1.1rem 1rem 1rem; text-align:center; break-inside:avoid; }
  .effname { font-family:"Fraunces",Georgia,serif; font-size:1.15rem; font-weight:600; }
  .pie { width:130px; height:130px; margin:.7rem auto .4rem; display:block; }
  .effpct { font-family:"Fraunces",Georgia,serif; font-size:1.7rem; font-weight:600; color:var(--done); line-height:1.1; }
  .efflbl { font-size:.82rem; color:var(--soft); margin-top:.15rem; }
  .effleg { display:flex; justify-content:center; gap:.9rem; flex-wrap:wrap; margin-top:.6rem; font-size:.76rem; color:var(--soft); }
  .effleg i { display:inline-block; width:.7rem; height:.7rem; border-radius:2px; margin-right:.3rem; vertical-align:-1px; }
  .effteam { display:flex; gap:1.6rem; align-items:baseline; flex-wrap:wrap; margin-top:1.1rem; padding:.8rem 1.1rem; background:var(--raised); border:1px solid var(--line); border-radius:4px; }
  .effteam b { font-family:"Fraunces",Georgia,serif; font-size:1.5rem; font-weight:600; color:var(--done); margin-right:.4rem; }
  .effnote { margin-top:1.2rem; font-size:.82rem; color:var(--faint); max-width:78ch; }
  footer { margin-top:3.5rem; padding-top:1.25rem; border-top:1px solid var(--line); font-size:.8rem; color:var(--faint); }

  @media (max-width:600px) {
    .wrap { padding:2rem 1.1rem 4rem; } header h1 { font-size:1.85rem; }
    .filter { position:static; } .ddbtn { min-width:0; width:100%; } .ddwrap { width:100%; }
    .summary { flex-direction:column; } .summary .stat { border-right:none; border-bottom:1px solid var(--line); } .summary .stat:last-child { border-bottom:none; }
    .row { flex-direction:column; gap:.1rem; } .row .k { width:auto; }
  }
  @media print {
    html, body { background:var(--paper); -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .wrap { padding:1.2rem 1.2rem 1.5rem; max-width:100%; }
    .filter, footer, .effctl { display:none !important; } .effgrid { grid-template-columns:repeat(3,1fr); }
    .day { display:block !important; margin-top:1.6rem; } .day + .day { break-before:page; page-break-before:always; }
    .task, .summary { break-inside:avoid; page-break-inside:avoid; } .person-head, .day-head { break-after:avoid; page-break-after:avoid; }
    .person { margin-top:1.2rem; } .task { margin-bottom:.45rem; padding:.7rem 1rem; }
  }
</style>
</head>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1>Daily Tracker</h1>

          <span class="lab" id="ddLabel"></span>
          <svg class="chev" width="12" height="8" viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M1 1l5 5 5-5"/></svg>
        </button>
        <div class="ddpanel" id="ddPanel" hidden></div>
      </div>
      <button class="pagebtn" type="button" data-page="standing">Standing items</button>
      <button class="pagebtn" type="button" data-page="planning">Sprint planning</button>
      <button class="pagebtn" type="button" data-page="efficiency">Team efficiency</button>
    </div>
  </div>

  <main id="app"></main>
  <footer>Version: 28 Oct, Sprint 23 day 3.</footer>
</div>

<script>
const BUILD = "2026-10-29-viewer-20";
const JIRA = "https://canaryai.atlassian.net/browse/";
const GROUPS = [["closed","CLOSED","Closed"],["progress","IN PROGRESS","In progress"],["notstarted","NOT STARTED","Not started"],["plan","PLANNED","Planned"]];
const GKEYS = GROUPS.map(g => g[0]), LABEL = Object.fromEntries(GROUPS.map(g => [g[0], g[2]]));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONFULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WD = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
let DATA = null, active = '', EFF = { sprint:'s22', metric:'tasks' };
const $ = id => document.getElementById(id);
const SEED = JSON.parse($('seed').textContent);

/* ---------- helpers ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = v => esc(v).replace(/PROD-\d+/g, m => `<a href="${JIRA}${m}" target="_blank" rel="noopener">${m}</a>`);
const dparts = d => { const [y, m, dd] = d.split('-').map(Number); return { y, m, d:dd, wd:new Date(Date.UTC(y, m - 1, dd)).getUTCDay() }; };
const longDate = d => { const p = dparts(d); return `${WD[p.wd]}, ${p.d} ${MON[p.m - 1]} ${p.y}`; };
const dmy = d => { const p = dparts(d); return `${p.d} ${MON[p.m - 1]} ${p.y}`; };
const fullShort = d => { const p = dparts(d); return `${WD[p.wd].slice(0, 3)} ${p.d} ${MON[p.m - 1]} ${p.y}`; };
const dayCount = d => { const p = dparts(d), n = new Date(); return Math.max(0, Math.round((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) - Date.UTC(p.y, p.m - 1, p.d)) / 86400000)); };
const isPlan = day => /PLAN/i.test(day.tag || '');
const isDateKey = k => /^\d{4}-\d{2}-\d{2}$/.test(k || '');
const SESS = {};
const sessHas = s => DATA.names.some(nm => { const p = s.people && s.people[nm]; return p && GKEYS.some(k => (p[k] || []).length); });
function sessionsOf(d) {
  if (d._ss) return d._ss;
  let out = [];
  if (d.am) out.push(Object.assign({ key:'am' }, d.am));
  if (d.pm) out.push(Object.assign({ key:'pm' }, d.pm));
  if (!out.length) out.push({ key: /PLAN/i.test(d.tag || '') ? 'am' : /EVENING/i.test(d.tag || '') ? 'pm' : 'day', tag:d.tag, people:d.people || {}, deployments:d.deployments, priorities:d.priorities, forDate:d.forDate });
  out = out.filter(sessHas);
  Object.defineProperty(d, '_ss', { value:out, enumerable:false }); return out;
}
const sessionOf = d => { const ss = sessionsOf(d); return ss.find(s => s.key === SESS[d.date]) || ss[ss.length - 1] || null; };
const person = (s, nm) => (s.people && s.people[nm]) || {};
const hasUpdate = d => sessionsOf(d).length > 0;
function parseHash(h) { const m = /^(\d{4}-\d{2}-\d{2})-(am|pm)$/.exec(h || ''); if (m) { SESS[m[1]] = m[2]; return m[1]; } return h || ''; }
const shownDays = () => DATA.days.filter(hasUpdate).sort((a, b) => a.date < b.date ? -1 : 1);

/* ---------- sprints ---------- */
const sprintOf = date => ((DATA && DATA.sprints) || []).find(s => date >= s.start && date <= s.end) || null;
function workdays(a, b) { let n = 0, d = a; while (d <= b) { const p = dparts(d); if (p.wd !== 0 && p.wd !== 6) n++; const q = new Date(Date.UTC(p.y, p.m - 1, p.d + 1)); d = q.toISOString().slice(0, 10); } return n; }
function sprintStripHTML(key) {
  if (key === 'planning') return '';
  const days = shownDays(), last = days.length ? days[days.length - 1].date : null, ref = isDateKey(key) ? key : last, sp = ref && sprintOf(ref); if (!sp) return '';
  const ds = dparts(sp.start), de = dparts(sp.end), total = workdays(sp.start, sp.end), day = workdays(sp.start, ref);
  const range = ds.m === de.m ? `${ds.d} to ${de.d} ${MON[de.m - 1]} ${de.y}` : `${ds.d} ${MON[ds.m - 1]} to ${de.d} ${MON[de.m - 1]} ${de.y}`;
  return `<div class="sprintstrip"><span class="dot"></span><b>${esc(sp.name)}</b><span>${range}</span><span>Day ${day} of ${total}</span></div>`;
}

/* ---------- days ---------- */
function card(t, st) {
  const since = (st === 'standing' && t.since) ? (() => { const n = dayCount(t.since); return `<div class="since">Standing since <b>${dmy(t.since)}</b>, ${n} day${n === 1 ? '' : 's'} so far</div>`; })() : '';
  return `<div class="task s-${st}"><div class="task-top"><div class="task-title">${linkify(t.t)}</div><span class="pill ${st}">${st === 'standing' ? 'Standing' : LABEL[st]}</span></div>${since}` +
    (t.rows && t.rows.length ? `<div class="rows">${t.rows.map(r => `<div class="row"><div class="k">${esc(r[0])}</div><div class="v">${linkify(r[1])}</div></div>`).join('')}</div>` : '') + `</div>`;
}
function personHTML(day, name) {
  const p = person(day, name), total = GKEYS.reduce((n, k) => n + (p[k] || []).length, 0);
  let h = `<div class="person"><div class="person-head"><h3>${esc(name)}</h3></div>`;
  if (p.jira) h += `<div class="meta"><b>Jira:</b> ${esc(p.jira)}</div>`;
  if (p.leave) return h + `<div class="none">${/HOLIDAY/i.test(day.tag) ? 'Holiday.' : 'On leave.'}</div></div>`;
  if (!total) return h + `<div class="none">${isPlan(day) ? 'No plan recorded.' : 'No update recorded.'}</div></div>`;
  GROUPS.forEach(([k, label]) => {
    const list = p[k] || []; if (!list.length) return;
    h += `<div class="grp ${k}"><div class="grp-head"><span class="gname">${label}</span><span class="gcount">${list.length}</span></div>${list.map(t => card(t, k)).join('')}</div>`;
  });
  return h + `</div>`;
}
function dayHTML(d) {
  const ss = sessionsOf(d), s = sessionOf(d); if (!s) return '';
  const cnt = k => DATA.names.reduce((n, nm) => n + (person(s, nm)[k] || []).length, 0);
  const stats = GROUPS.filter(g => cnt(g[0]) > 0).map(g => `<div class="stat ${g[0]}"><div class="num">${cnt(g[0])}</div><div class="lbl">${g[2]}</div></div>`).join('');
  const toggle = ss.length > 1 ? `<div class="ampm" role="group" aria-label="Morning or evening">${ss.map(x => `<button type="button" class="amb${x.key === s.key ? ' on' : ''}" data-day="${d.date}" data-sess="${x.key}" aria-pressed="${x.key === s.key}">${x.key === 'am' ? 'AM' : 'PM'}</button>`).join('')}</div>` : '';
  return `<section class="day" data-key="${d.date}"><div class="day-head"><h2>${longDate(d.date)}</h2><div class="headtags">${sprintOf(d.date) ? `<span class="sprintbadge">${esc(sprintOf(d.date).name)}</span>` : ''}${toggle}<span class="kind ${isPlan(s) ? 'Plan' : 'Update'}">${esc(s.tag)}</span></div></div>` +
    `<div class="summary">${stats}</div>${DATA.names.map(nm => personHTML(s, nm)).join('')}</section>`;
}
function standingHTML() {
  const people = DATA.names.map(nm => {
    const items = (DATA.standing[nm] || []).slice().sort((a, b) => (a.since || '9999') < (b.since || '9999') ? -1 : 1);
    return `<div class="person"><div class="person-head"><h3>${esc(nm)}</h3></div>${items.length ? items.map(t => card(t, 'standing')).join('') : '<div class="none">No standing items.</div>'}</div>`;
  }).join('');
  return `<section class="day" data-key="standing"><div class="day-head"><h2>Standing items</h2><span class="kind Plan">STANDING</span></div>` +
    `<p class="lead">Work that stays open across days, independent of any single date. Each item shows when it became standing.</p>${people}</section>`;
}

/* ---------- sprint planning ---------- */
let PLAN = { sprint:null, open:false, q:'' };
const CHEV = '<svg class="chev" width="12" height="8" viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M1 1l5 5 5-5"/></svg>';
const sprintsDesc = () => ((DATA && DATA.sprints) || []).slice().sort((a, b) => a.start < b.start ? 1 : -1);
const currentSprint = () => { const days = shownDays(), last = days.length ? days[days.length - 1].date : null; return (last && sprintOf(last)) || sprintsDesc()[0] || null; };
const planEntry = s => (((DATA.sprintPlanning || {}).sprints) || []).find(x => x.id === s.id) || null;
const planCount = s => { const e = planEntry(s); return e ? DATA.names.reduce((n, nm) => n + ((e.items[nm] || []).length), 0) : 0; };
const planSel = () => { const sps = sprintsDesc(); return sps.find(s => s.id === PLAN.sprint) || currentSprint() || sps[0] || null; };
function sprintStateOf(s) { const c = currentSprint(); return !c || s.id === c.id ? 'Current' : s.end < c.start ? 'Closed' : 'Upcoming'; }
function planListHTML() {
  const sel = planSel(), q = (PLAN.q || '').trim().toLowerCase();
  const rows = sprintsDesc().filter(s => !q || (s.name + ' ' + sprintRange(s) + ' ' + sprintStateOf(s)).toLowerCase().includes(q));

}

  const sel = planSel(), idx = sps.indexOf(sel), e = planEntry(sel), items = (e && e.items) || {}, total = planCount(sel);
  const selector = `<div class="plansel"><button class="navb" data-planstep="1" aria-label="Older sprint"${idx >= sps.length - 1 ? ' disabled' : ''}>&lsaquo;</button>` +
    `<div class="ddwrap"><button class="ddbtn" id="planBtn" type="button" aria-expanded="${PLAN.open ? 'true' : 'false'}"><span class="lab"><b>${esc(sel.name)}</b><span>${sprintRange(sel)}</span></span>${CHEV}</button>` +
    `<div class="ddpanel" id="planPanel"${PLAN.open ? '' : ' hidden'}><input class="ddsearch" id="planSearch" type="search" placeholder="Search sprints, for example 23" value="${esc(PLAN.q || '')}" autocomplete="off"><div id="planList">${planListHTML()}</div></div></div>` +
    `<button class="navb" data-planstep="-1" aria-label="Newer sprint"${idx <= 0 ? ' disabled' : ''}>&rsaquo;</button></div>`;
  const people = total ? DATA.names.map(nm => { const list = items[nm] || [];
    return `<div class="person"><div class="person-head"><h3>${esc(nm)}</h3></div>${list.length ? list.map(x => card(x, 'plan')).join('') : '<div class="none">No items listed yet.</div>'}</div>`; }).join('')
    : `<div class="none" style="margin-top:1.6rem">${sprintStateOf(sel) === 'Closed' ? esc(sel.name) + ' is closed.' : 'Nothing planned for ' + esc(sel.name) + ' yet.'}</div>`;
  return `<div class="day-head"><h2>Sprint planning</h2><span class="kind Plan">${esc(sel.name.toUpperCase())}</span></div>${selector}` +
    `<p class="lead">${esc(sel.name)}, ${sprintRange(sel)}. ${total ? total + ' planned items, by owner.' : (sprintStateOf(sel) === 'Closed' ? 'Closed.' : 'Nothing planned yet.')}</p>${people}`;
}
const rerenderPlan = () => { const ps = $('planSection'); if (ps) ps.innerHTML = planInner(); };
const planningHTML = () => ((DATA.sprints && DATA.sprints.length) || (DATA.sprintPlanning && DATA.sprintPlanning.sprints && DATA.sprintPlanning.sprints.length)) ? `<section class="day" data-key="planning" id="planSection">${planInner()}</section>` : '';

/* ---------- efficiency ---------- */
function pieSVG(c, o) {
  const r = 58, cx = 70, cy = 70, tot = c + o, G = '#1F7A4D', Y = '#B08D57';
  if (!tot) return `<svg viewBox="0 0 140 140" class="pie" role="img" aria-label="No data"><circle cx="70" cy="70" r="58" fill="#EDEEF0" stroke="#DADDE1"/></svg>`;
  if (!o) return `<svg viewBox="0 0 140 140" class="pie" role="img" aria-label="All closed"><circle cx="70" cy="70" r="58" fill="${G}"/></svg>`;
  if (!c) return `<svg viewBox="0 0 140 140" class="pie" role="img" aria-label="None closed"><circle cx="70" cy="70" r="58" fill="${Y}"/></svg>`;
  const a = 2 * Math.PI * c / tot, x = cx + r * Math.sin(a), y = cy - r * Math.cos(a), large = a > Math.PI ? 1 : 0;
  return `<svg viewBox="0 0 140 140" class="pie" role="img" aria-label="${c} closed, ${o} open"><circle cx="70" cy="70" r="58" fill="${Y}"/><path d="M${cx} ${cy} L${cx} ${cy - r} A${r} ${r} 0 ${large} 1 ${x.toFixed(2)} ${y.toFixed(2)} Z" fill="${G}" stroke="#fff" stroke-width="1.5"/></svg>`;
}
const EFF_ORDER = ['Sumit','Aditi','Abhishek','Nikita','Chetan','Rushikesh'];
function effInner() {
  const E = DATA.efficiency; if (!E) return '';
  const sp = E.sprints.find(s => s.id === EFF.sprint) || E.sprints[0], hrs = EFF.metric === 'hours';
  const ck = hrs ? 'closedHours' : 'closedTasks', ok = hrs ? 'openHours' : 'openTasks';
  const fmt = v => hrs ? (Math.round(v * 10) / 10) + 'h' : String(v);
  const names = EFF_ORDER.filter(n => sp.people[n]).concat(Object.keys(sp.people).filter(n => !EFF_ORDER.includes(n)));
  const openLbl = sp.id === 's21' ? 'Carried to Sprint 22' : 'Still open'; let tc = 0, to = 0;
  const cards = names.map(n => {
    const p = sp.people[n], c = p[ck], o = p[ok], tot = c + o; tc += c; to += o; const pct = tot ? Math.round(c / tot * 100) : null;
    return `<div class="effcard"><div class="effname">${esc(n)}</div>${pieSVG(c, o)}<div class="effpct">${pct === null ? 'No data' : pct + '%'}</div>` +
      `<div class="efflbl">${pct === null ? (hrs ? 'No estimates yet' : 'No tickets') : `closed ${fmt(c)} of ${fmt(tot)}${hrs ? '' : ' tickets'}`}</div>` +
      `<div class="effleg"><span><i style="background:#1F7A4D"></i>Closed ${fmt(c)}</span><span><i style="background:#B08D57"></i>${openLbl} ${fmt(o)}</span></div></div>`;
  }).join('');
  const tpct = (tc + to) ? Math.round(tc / (tc + to) * 100) : 0, u = hrs ? '' : ' tickets';
  const ctl = `<div class="effctl"><div class="seg">${E.sprints.map(s => `<button class="segb${s.id === sp.id ? ' on' : ''}" data-eff="sprint:${s.id}">${esc(s.name)}</button>`).join('')}</div>` +
    `<div class="seg"><button class="segb${!hrs ? ' on' : ''}" data-eff="metric:tasks">Tickets</button><button class="segb${hrs ? ' on' : ''}" data-eff="metric:hours">Hours</button></div></div>`;
  const asOf = E.asOf ? (() => { const p = dparts(E.asOf); return `${p.d} ${MON[p.m - 1]} ${p.y}`; })() : '';
  return `<div class="day-head"><h2>Team efficiency: closing tasks</h2><span class="kind Update">${esc(sp.status.toUpperCase())}</span></div>${ctl}` +
    `<div class="effmeta">${esc(sp.name)}, ${esc(sp.dates)}. Share of each person's tickets that were closed. Figures from Jira as of ${asOf}.</div>` +
    `<div class="effteam"><span><b>${tpct}%</b>team closed</span><span>${fmt(tc)}${u} closed</span><span>${fmt(to)}${u} ${sp.id === 's21' ? 'carried to Sprint 22' : 'still open'}</span></div>` +
    `<div class="effgrid">${cards}</div><div class="effnote">${esc(sp.note)}</div>`;
}

/* ---------- date filter ---------- */
const sprintById = id => ((DATA && DATA.sprints) || []).find(s => s.id === id) || null;
const sprintRange = s => { const a = dparts(s.start), b = dparts(s.end); return a.m === b.m ? `${a.d} to ${b.d} ${MON[b.m - 1]} ${b.y}` : `${a.d} ${MON[a.m - 1]} to ${b.d} ${MON[b.m - 1]} ${b.y}`; };
function panelHTML() {
  const days = shownDays().reverse(), years = [];
  days.forEach(d => { const p = dparts(d.date); let y = years.find(x => x.y === p.y); if (!y) years.push(y = { y:p.y, months:[] });
    let m = y.months.find(x => x.m === p.m); if (!m) y.months.push(m = { m:p.m, days:[] }); m.days.push({ date:d.date, p }); });
  return `<button class="ddall${active === 'all' ? ' on' : ''}" data-key="all">All dates</button>` +
    years.map(y => `<div class="ddyear">${y.y}</div>` + y.months.map(m => `<div class="ddmonth">${MONFULL[m.m - 1]}</div><div class="ddgrid">` +
      m.days.map(x => `<button class="ddday${active === x.date ? ' on' : ''}" data-key="${x.date}"><b>${x.p.d}</b><span>${WD[x.p.wd].slice(0, 3)}</span></button>`).join('') + `</div>`).join('')).join('');
}
function renderFilter() {
  const isDate = /^\d{4}-/.test(active), lab = $('ddLabel');
  lab.textContent = isDate ? fullShort(active) : active === 'all' ? 'All dates' : 'Select a date';
  lab.classList.toggle('muted', !isDate && active !== 'all');
  $('ddPanel').innerHTML = panelHTML();
  document.querySelectorAll('.pagebtn').forEach(b => b.classList.toggle('on', b.dataset.page === active));
}
function closePanel() { $('ddPanel').hidden = true; $('ddBtn').setAttribute('aria-expanded', 'false'); }
$('ddBtn').addEventListener('click', e => { e.stopPropagation(); const open = $('ddPanel').hidden; $('ddPanel').hidden = !open; $('ddBtn').setAttribute('aria-expanded', String(open)); if (open) { const on = $('ddPanel').querySelector('.on'); if (on) on.scrollIntoView({ block:'nearest' }); } });
document.addEventListener('click', e => {
  const am = e.target.closest('.amb'); if (am) { const dt = am.dataset.day, day = DATA.days.find(x => x.date === dt), sec = document.querySelector('.day[data-key="' + dt + '"]'); SESS[dt] = am.dataset.sess; if (day && sec) { sec.outerHTML = dayHTML(day); show(active); } return; }
  const pick = e.target.closest('.ddday, .ddall'); if (pick) { show(pick.dataset.key); closePanel(); return; }
  const pg = e.target.closest('.pagebtn'); if (pg) { show(pg.dataset.page); closePanel(); return; }
  const pl = e.target.closest('.plansp'); if (pl) { PLAN.sprint = pl.dataset.plan; PLAN.open = false; PLAN.q = ''; rerenderPlan(); return; }
  const pst = e.target.closest('[data-planstep]'); if (pst) { if (!pst.disabled) { const sps = sprintsDesc(), i = sps.indexOf(planSel()), nx = sps[i + Number(pst.dataset.planstep)]; if (nx) { PLAN.sprint = nx.id; rerenderPlan(); } } return; }
  if (e.target.closest('#planBtn')) { PLAN.open = !PLAN.open; rerenderPlan(); if (PLAN.open) setTimeout(() => { const s = $('planSearch'); if (s) s.focus(); }, 0); return; }
  if (PLAN.open && !e.target.closest('.plansel')) { PLAN.open = false; PLAN.q = ''; rerenderPlan(); }
  const eb = e.target.closest('button[data-eff]'); if (eb) { const [k, v] = eb.dataset.eff.split(':'); EFF[k] = v; const sec = $('effSection'); if (sec) sec.innerHTML = effInner(); return; }
  if (!e.target.closest('.ddwrap')) closePanel();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closePanel(); if (PLAN.open) { PLAN.open = false; PLAN.q = ''; rerenderPlan(); } } });
document.addEventListener('input', e => { if (e.target.id !== 'planSearch') return; PLAN.q = e.target.value; const l = $('planList'); if (l) l.innerHTML = planListHTML(); });

/* ---------- top sections: deployments and priority items ---------- */
function topSectionsHTML(key) {
  const d = isDateKey(key) ? DATA.days.find(x => x.date === key) : null, s = d && sessionOf(d); if (!s) return '';
  const dep = s.deployments || [], pri = s.priorities || []; if (!dep.length && !pri.length) return '';
  const fd = s.forDate || d.date, n = new Date();
  const today = `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`;
  const when = fd === today ? 'TODAY' : 'MARKED FOR';
  const depHTML = dep.length ? `<div class="dep" role="region" aria-label="Deployments"><div class="dep-head"><span class="dep-tag">DEPLOYMENTS ${when}</span><b>${longDate(fd)}</b></div><div class="dep-grid">` +
    dep.map(x => `<div class="dep-item"><div class="dep-env ${esc(x.env)}">${esc(x.env)}</div><div><div class="dep-title">${linkify(x.item)}</div>` +
      `<div class="dep-meta"><span><b>Owner</b> ${esc(x.owner)}</span>${x.when ? `<span><b>When</b> ${esc(x.when)}</span>` : ''}</div>${x.note ? `<div class="dep-note">${linkify(x.note)}</div>` : ''}</div></div>`).join('') + `</div></div>` : '';
  const priHTML = pri.length ? `<div class="prio" role="region" aria-label="Priority items"><div class="dep-head"><span class="prio-tag">PRIORITY ITEMS ${when === 'TODAY' ? 'TODAY' : 'FOR'}</span><b>${longDate(fd)}</b></div><div class="prio-list">` +
    pri.map((x, i) => (x.group && x.group !== (pri[i - 1] || {}).group ? `<div class="prio-group">${esc(x.group)}</div>` : '') + `<div class="prio-item"><div class="prio-num">${i + 1}</div><div><div class="dep-title">${linkify(x.item)}</div><div class="dep-meta"><span><b>Owner</b> ${esc(x.owner)}</span></div>${x.note ? `<div class="dep-note">${linkify(x.note)}</div>` : ''}</div></div>`).join('') + `</div></div>` : '';
  return depHTML + priHTML;
}

/* ---------- view ---------- */
function fixActive() {
  const days = shownDays(), keys = ['all', 'standing', 'planning', 'efficiency'].concat(days.map(d => d.date));
  if (!keys.includes(active) || (active === 'efficiency' && !DATA.efficiency) || (active === 'planning' && !planningHTML())) active = days.length ? days[days.length - 1].date : 'all';
}
function render() {
  fixActive();
  $('app').innerHTML = shownDays().map(dayHTML).join('') + standingHTML() + planningHTML() + (DATA.efficiency ? `<section class="day" data-key="efficiency" id="effSection">${effInner()}</section>` : '');
  show(active, true);
}
function show(key, quiet) {
  active = key;
  document.querySelectorAll('.day').forEach(sec => { const sk = sec.dataset.key; sec.style.display = ((key === 'all' && sk !== 'efficiency' && sk !== 'planning') || sk === key) ? '' : 'none'; });
  const d = DATA.days.find(x => x.date === key);
  $('eyebrow').textContent = d ? longDate(d.date).toUpperCase() : (key === 'standing' ? 'STANDING ITEMS' : key === 'efficiency' ? 'TEAM EFFICIENCY' : key === 'planning' ? 'SPRINT PLANNING' : 'ALL DATES');
  renderFilter();
  $('depBanner').innerHTML = topSectionsHTML(key); $('sprintStrip').innerHTML = sprintStripHTML(key);
  if (!quiet && history.replaceState) { const sd = d && sessionsOf(d).length > 1 ? sessionOf(d) : null; history.replaceState(null, '', '#' + key + (sd ? '-' + sd.key : '')); }
}
window.addEventListener('hashchange', () => { const k = parseHash(location.hash.slice(1)); if (!k || !DATA) return; active = k; render(); });

/* ---------- load, refresh ---------- */
async function fetchData() {
  if (location.protocol === 'file:') return null;
  try { const r = await fetch('data.json?_=' + Date.now(), { cache:'no-store' }); return r.ok ? await r.json() : null; } catch (e) { return null; }
}
async function load() { DATA = (await fetchData()) || SEED; DATA.standing = DATA.standing || {}; active = parseHash(location.hash.slice(1)); render(); }
async function poll() { if (document.hidden || !DATA) return; const r = await fetchData(); if (r && r.updated !== DATA.updated) { DATA = r; DATA.standing = DATA.standing || {}; render(); } }
load(); setInterval(poll, 60000); document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });

/* Always show the latest version of this page: GitHub Pages lets browsers cache it for about 10 minutes. */
(function checkForUpdate() {
  if (location.protocol === 'file:') return;
  fetch(location.href.split('#')[0], { cache:'reload' }).then(r => r.text()).then(t => {
    const m = t.match(/const BUILD = "([^"]+)"/);
    if (m && m[1] !== BUILD && !sessionStorage.getItem('tracker_reloaded')) { sessionStorage.setItem('tracker_reloaded', '1'); location.reload(); }
  }).catch(() => {});
})();
</script>
