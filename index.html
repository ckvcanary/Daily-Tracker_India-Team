    --plan:#1E4E8C; --plan-bg:#E8EEF6; --carry:#6B7280; --carry-bg:#EDEEF0;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased; }
  h1,h2,h3 { font-family:"Fraunces",Georgia,serif; margin:0; }
  button { font:inherit; cursor:pointer; }

  .wrap { max-width:880px; margin:0 auto; padding:3rem 1.5rem 5rem; }

  header h1 { font-size:2.35rem; font-weight:600; letter-spacing:-.01em; }
  header p.sub { margin:.6rem 0 0; color:var(--soft); max-width:62ch; }

  /* filter */
  .filter { position:sticky; top:0; z-index:20; background:var(--paper); padding:1rem 0 .9rem; margin-top:1.5rem; border-bottom:1px solid var(--line2); }
  .filter .label { font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--faint); letter-spacing:.04em; margin-bottom:.5rem; }
  .frow { display:flex; flex-wrap:wrap; align-items:center; gap:.6rem; }
  .ddwrap { position:relative; }
  .ddbtn { display:inline-flex; align-items:center; gap:.65rem; min-width:15.5rem; background:var(--raised); border:1px solid var(--line2); border-radius:8px; padding:.55rem .85rem; color:var(--ink); font-size:.95rem; font-weight:500; text-align:left; }
  .ddbtn:hover, .ddbtn[aria-expanded="true"] { border-color:var(--ink); }
  .ddbtn svg { flex-shrink:0; color:var(--soft); }
  .ddbtn .lab { flex:1; }
  .ddbtn .lab.muted { color:var(--faint); font-weight:400; }
  .ddbtn .chev { transition:transform .15s; } .ddbtn[aria-expanded="true"] .chev { transform:rotate(180deg); }
  .ddpanel { position:absolute; left:0; top:calc(100% + .4rem); z-index:30; width:min(24rem,92vw); max-height:min(26rem,70vh); overflow:auto; background:var(--raised); border:1px solid var(--line2); border-radius:10px; box-shadow:0 14px 40px rgba(20,33,61,.18); padding:.5rem .5rem .9rem; }
  .ddpanel[hidden] { display:none; }
  .ddall { display:block; width:100%; text-align:left; border:none; background:transparent; padding:.55rem .7rem; border-radius:6px; font-weight:600; font-size:.92rem; color:var(--ink); }
  .ddall:hover { background:var(--paper); } .ddall.on { background:var(--ink); color:#fff; }
  .ddyear { font-family:"Fraunces",Georgia,serif; font-size:1.05rem; font-weight:600; padding:.8rem .7rem .15rem; border-top:1px solid var(--line); margin-top:.45rem; }
  .ddmonth { font-family:"IBM Plex Mono",monospace; font-size:.72rem; letter-spacing:.05em; color:var(--faint); text-transform:uppercase; padding:.5rem .7rem .3rem; }
  .ddgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(3.6rem,1fr)); gap:.4rem; padding:0 .5rem; }
  .ddday { display:flex; flex-direction:column; align-items:center; gap:0; border:1px solid var(--line2); background:var(--raised); border-radius:8px; padding:.35rem 0; color:var(--ink); line-height:1.15; }
  .ddday b { font-size:1rem; font-weight:600; } .ddday span { font-size:.68rem; color:var(--faint); }
  .ddday:hover { border-color:var(--ink); }
  .ddday.on { background:var(--ink); border-color:var(--ink); color:#fff; } .ddday.on span { color:#C9D2DE; }
  .pagebtn { font-size:.9rem; font-weight:500; color:var(--soft); background:var(--raised); border:1px solid var(--line2); border-radius:8px; padding:.55rem 1rem; }
  .pagebtn:hover { border-color:var(--ink); color:var(--ink); }
  .pagebtn.on { background:var(--ink); border-color:var(--ink); color:#fff; }

  /* deployments marked for the day, highlighted at the top */
  .dep { margin-top:1.4rem; background:#FFF6DC; border:1.5px solid #E2B84A; border-left:6px solid #C98A00; border-radius:8px; padding:1rem 1.2rem 1.1rem; box-shadow:0 2px 10px rgba(201,138,0,.12); }
  .dep-head { display:flex; flex-wrap:wrap; align-items:center; gap:.7rem; }
  .dep-tag { font-family:"IBM Plex Mono",monospace; font-size:.72rem; letter-spacing:.06em; font-weight:500; background:#C98A00; color:#fff; padding:.22rem .65rem; border-radius:100px; }
  .dep-head b { font-family:"Fraunces",Georgia,serif; font-size:1.15rem; font-weight:600; color:#5A3A0C; }
  .dep-grid { display:grid; gap:.6rem; margin-top:.85rem; }
  .dep-item { display:flex; gap:.9rem; align-items:flex-start; background:#fff; border:1px solid #EBD79A; border-radius:6px; padding:.7rem .9rem; }
  .dep-env { flex-shrink:0; min-width:3.4rem; text-align:center; font-size:.74rem; font-weight:600; letter-spacing:.04em; padding:.3rem .55rem; border-radius:6px; margin-top:.1rem; }
  .dep-env.UAT { background:var(--plan-bg); color:var(--plan); } .dep-env.Prod { background:var(--done-bg); color:var(--done); }
  .dep-title { font-weight:600; font-size:.97rem; }
  .dep-meta { margin-top:.15rem; font-size:.84rem; color:var(--soft); display:flex; flex-wrap:wrap; gap:.2rem 1.2rem; }
  .dep-meta b { font-weight:600; color:var(--ink); }
  .dep-note { margin-top:.2rem; font-size:.82rem; color:var(--faint); }

  /* days */
  .day { margin-top:2.75rem; }
  .day-head { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.6rem; }
  .day-head h2 { font-size:1.6rem; font-weight:600; }
  .kind { font-family:"IBM Plex Mono",monospace; font-size:.72rem; letter-spacing:.05em; padding:.2rem .6rem; border-radius:100px; }
  .kind.Update { background:var(--done-bg); color:var(--done); } .kind.Plan { background:var(--plan-bg); color:var(--plan); }
  .lead { margin:.7rem 0 0; color:var(--soft); font-size:.92rem; max-width:70ch; }
  .summary { display:flex; border:1px solid var(--line); border-radius:4px; overflow:hidden; margin-top:1rem; background:var(--raised); }
  .summary .stat { flex:1; padding:.85rem 1.1rem; border-right:1px solid var(--line); } .summary .stat:last-child { border-right:none; }
  .summary .num { font-family:"Fraunces",serif; font-size:1.6rem; font-weight:600; line-height:1; }
  .summary .lbl { font-size:.78rem; color:var(--soft); margin-top:.3rem; }
  .summary .closed .num { color:var(--done); } .summary .progress .num { color:var(--prog); } .summary .notstarted .num, .summary .plan .num { color:var(--plan); }
  .person { margin-top:2rem; }
  .person-head { border-bottom:1px solid var(--line2); padding-bottom:.5rem; margin-bottom:1rem; }
  .person-head h3 { font-size:1.2rem; font-weight:600; }
  .meta { font-size:.82rem; color:var(--soft); margin:-.4rem 0 .2rem; } .meta b { color:var(--ink); font-weight:600; }
  .grp { margin-top:1.1rem; }
  .grp-head { display:flex; align-items:center; gap:.6rem; margin-bottom:.55rem; }
  .gname { font-family:"IBM Plex Mono",monospace; font-size:.74rem; letter-spacing:.06em; font-weight:500; } .gcount { font-size:.74rem; color:var(--faint); }
  .grp.closed .gname { color:var(--done); } .grp.progress .gname { color:var(--prog); } .grp.notstarted .gname, .grp.plan .gname { color:var(--plan); }
  .none { font-size:.88rem; color:var(--faint); font-style:italic; margin-top:.8rem; }
  .task { border-left:3px solid var(--line2); background:var(--raised); border-top:1px solid var(--line); border-right:1px solid var(--line); border-bottom:1px solid var(--line); border-radius:0 3px 3px 0; padding:.9rem 1.15rem; margin-bottom:.65rem; }
  .task.s-closed { border-left-color:var(--done); } .task.s-progress { border-left-color:var(--prog); }
  .task.s-notstarted, .task.s-plan { border-left-color:var(--plan); } .task.s-standing { border-left-color:var(--carry); }

  .pill.notstarted, .pill.plan { background:var(--plan-bg); color:var(--plan); } .pill.standing { background:var(--carry-bg); color:var(--carry); }
  .since { margin-top:.3rem; font-size:.8rem; color:var(--carry); }
  .since b { font-weight:600; color:var(--ink); }
  .rows { margin-top:.45rem; font-size:.9rem; }
  .row { display:flex; gap:.5rem; margin-top:.2rem; }
  .row .k { flex-shrink:0; width:5.6rem; color:var(--faint); font-size:.78rem; padding-top:.1rem; }

  .efflbl { font-size:.82rem; color:var(--soft); margin-top:.15rem; }

  .effteam { display:flex; gap:1.6rem; align-items:baseline; flex-wrap:wrap; margin-top:1.1rem; padding:.8rem 1.1rem; background:var(--raised); border:1px solid var(--line); border-radius:4px; }
  .effteam b { font-family:"Fraunces",Georgia,serif; font-size:1.5rem; font-weight:600; color:var(--done); margin-right:.4rem; }
  .effnote { margin-top:1.2rem; font-size:.82rem; color:var(--faint); max-width:78ch; }
  footer { margin-top:3.5rem; padding-top:1.25rem; border-top:1px solid var(--line); font-size:.8rem; color:var(--faint); }

  @media (max-width:600px) {
    .wrap { padding:2rem 1.1rem 4rem; } header h1 { font-size:1.85rem; }
    .filter { position:static; } .ddbtn { min-width:0; width:100%; } .ddwrap { width:100%; }
    .summary { flex-direction:column; } .summary .stat { border-right:none; border-bottom:1px solid var(--line); } .summary .stat:last-child { border-bottom:none; }
    .row { flex-direction:column; gap:.1rem; } .row .k { width:auto; }

    .wrap { padding:1.2rem 1.2rem 1.5rem; max-width:100%; }
    .filter, footer, .effctl { display:none !important; } .effgrid { grid-template-columns:repeat(3,1fr); }
    .day { display:block !important; margin-top:1.6rem; } .day + .day { break-before:page; page-break-before:always; }
    .task, .summary { break-inside:avoid; page-break-inside:avoid; } .person-head, .day-head { break-after:avoid; page-break-after:avoid; }
    .person { margin-top:1.2rem; } .task { margin-bottom:.45rem; padding:.7rem 1rem; }
  }
</style>

<script>
const BUILD = "2026-10-22-viewer-2";
const JIRA = "https://canaryai.atlassian.net/browse/";
const GROUPS = [["closed","CLOSED","Closed"],["progress","IN PROGRESS","In progress"],["notstarted","NOT STARTED","Not started"],["plan","PLANNED","Planned"]];
const GKEYS = GROUPS.map(g => g[0]), LABEL = Object.fromEntries(GROUPS.map(g => [g[0], g[2]]));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONFULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WD = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
let DATA = null, active = '', EFF = { sprint:'s21', metric:'tasks' };
const $ = id => document.getElementById(id);
const SEED = JSON.parse($('seed').textContent);

/* ---------- helpers ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = v => esc(v).replace(/PROD-\d+/g, m => `<a href="${JIRA}${m}" target="_blank" rel="noopener">${m}</a>`);
const dparts = d => { const [y, m, dd] = d.split('-').map(Number); return { y, m, d:dd, wd:new Date(Date.UTC(y, m - 1, dd)).getUTCDay() }; };
const longDate = d => { const p = dparts(d); return `${WD[p.wd]}, ${p.d} ${MON[p.m - 1]} ${p.y}`; };
const dmy = d => { const p = dparts(d); return `${p.d} ${MON[p.m - 1]} ${p.y}`; };
const fullShort = d => { const p = dparts(d); return `${WD[p.wd].slice(0, 3)} ${p.d} ${MON[p.m - 1]} ${p.y}`; };
const dayCount = d => { const p = dparts(d), n = new Date(); return Math.max(0, Math.round((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) - Date.UTC(p.y, p.m - 1, p.d)) / 86400000)); };
const isPlan = day => /PLAN/i.test(day.tag || '');
const person = (day, nm) => day.people[nm] || {};
const hasUpdate = d => DATA.names.some(nm => { const p = d.people[nm]; return p && GKEYS.some(k => (p[k] || []).length); });
const shownDays = () => DATA.days.filter(hasUpdate).sort((a, b) => a.date < b.date ? -1 : 1);

/* ---------- days ---------- */
function card(t, st) {
  const since = (st === 'standing' && t.since) ? (() => { const n = dayCount(t.since); return `<div class="since">Standing since <b>${dmy(t.since)}</b>, ${n} day${n === 1 ? '' : 's'} so far</div>`; })() : '';
  return `<div class="task s-${st}"><div class="task-top"><div class="task-title">${linkify(t.t)}</div><span class="pill ${st}">${st === 'standing' ? 'Standing' : LABEL[st]}</span></div>${since}` +
    (t.rows && t.rows.length ? `<div class="rows">${t.rows.map(r => `<div class="row"><div class="k">${esc(r[0])}</div><div class="v">${linkify(r[1])}</div></div>`).join('')}</div>` : '') + `</div>`;
}
function personHTML(day, name) {
  const p = person(day, name), total = GKEYS.reduce((n, k) => n + (p[k] || []).length, 0);
  let h = `<div class="person"><div class="person-head"><h3>${esc(name)}</h3></div>`;
  if (p.jira) h += `<div class="meta"><b>Jira:</b> ${esc(p.jira)}</div>`;
  if (p.leave) return h + `<div class="none">${/HOLIDAY/i.test(day.tag) ? 'Holiday.' : 'On leave.'}</div></div>`;
  if (!total) return h + `<div class="none">${isPlan(day) ? 'No plan reported.' : 'No update reported.'}</div></div>`;
  GROUPS.forEach(([k, label]) => {
    const list = p[k] || []; if (!list.length) return;
    h += `<div class="grp ${k}"><div class="grp-head"><span class="gname">${label}</span><span class="gcount">${list.length}</span></div>${list.map(t => card(t, k)).join('')}</div>`;
  });
  return h + `</div>`;
}
function dayHTML(d) {
  const cnt = k => DATA.names.reduce((n, nm) => n + (person(d, nm)[k] || []).length, 0);
  const stats = GROUPS.filter(g => cnt(g[0]) > 0).map(g => `<div class="stat ${g[0]}"><div class="num">${cnt(g[0])}</div><div class="lbl">${g[2]}</div></div>`).join('');
  return `<section class="day" data-key="${d.date}"><div class="day-head"><h2>${longDate(d.date)}</h2><span class="kind ${isPlan(d) ? 'Plan' : 'Update'}">${esc(d.tag)}</span></div>` +
    `<div class="summary">${stats}</div>${DATA.names.map(nm => personHTML(d, nm)).join('')}</section>`;
}
function standingHTML() {
  const people = DATA.names.map(nm => {
    const items = (DATA.standing[nm] || []).slice().sort((a, b) => (a.since || '9999') < (b.since || '9999') ? -1 : 1);
    return `<div class="person"><div class="person-head"><h3>${esc(nm)}</h3></div>${items.length ? items.map(t => card(t, 'standing')).join('') : '<div class="none">No standing items.</div>'}</div>`;
  }).join('');
  return `<section class="day" data-key="standing"><div class="day-head"><h2>Standing items</h2><span class="kind Plan">STANDING</span></div>` +
    `<p class="lead">Work that stays open from day to day, not tied to one date. Each item shows when it started standing.</p>${people}</section>`;
}

/* ---------- efficiency ---------- */
function pieSVG(c, o) {
  const r = 58, cx = 70, cy = 70, tot = c + o, G = '#1F7A4D', Y = '#B08D57';
  if (!tot) return `<svg viewBox="0 0 140 140" class="pie" role="img" aria-label="No data"><circle cx="70" cy="70" r="58" fill="#EDEEF0" stroke="#DADDE1"/></svg>`;
  if (!o) return `<svg viewBox="0 0 140 140" class="pie" role="img" aria-label="All closed"><circle cx="70" cy="70" r="58" fill="${G}"/></svg>`;
  if (!c) return `<svg viewBox="0 0 140 140" class="pie" role="img" aria-label="None closed"><circle cx="70" cy="70" r="58" fill="${Y}"/></svg>`;
  const a = 2 * Math.PI * c / tot, x = cx + r * Math.sin(a), y = cy - r * Math.cos(a), large = a > Math.PI ? 1 : 0;
  return `<svg viewBox="0 0 140 140" class="pie" role="img" aria-label="${c} closed, ${o} open"><circle cx="70" cy="70" r="58" fill="${Y}"/><path d="M${cx} ${cy} L${cx} ${cy - r} A${r} ${r} 0 ${large} 1 ${x.toFixed(2)} ${y.toFixed(2)} Z" fill="${G}" stroke="#fff" stroke-width="1.5"/></svg>`;
}
const EFF_ORDER = ['Sumit','Aditi','Abhishek','Nikita','Chetan','Rushikesh'];
function effInner() {
  const E = DATA.efficiency; if (!E) return '';
  const sp = E.sprints.find(s => s.id === EFF.sprint) || E.sprints[0], hrs = EFF.metric === 'hours';
  const ck = hrs ? 'closedHours' : 'closedTasks', ok = hrs ? 'openHours' : 'openTasks';
  const fmt = v => hrs ? (Math.round(v * 10) / 10) + 'h' : String(v);
  const names = EFF_ORDER.filter(n => sp.people[n]).concat(Object.keys(sp.people).filter(n => !EFF_ORDER.includes(n)));
  const openLbl = sp.id === 's21' ? 'Carried to Sprint 22' : 'Still open'; let tc = 0, to = 0;
  const cards = names.map(n => {
    const p = sp.people[n], c = p[ck], o = p[ok], tot = c + o; tc += c; to += o; const pct = tot ? Math.round(c / tot * 100) : null;
    return `<div class="effcard"><div class="effname">${esc(n)}</div>${pieSVG(c, o)}<div class="effpct">${pct === null ? 'No data' : pct + '%'}</div>` +
      `<div class="efflbl">${pct === null ? (hrs ? 'No estimates yet' : 'No tickets') : `closed ${fmt(c)} of ${fmt(tot)}${hrs ? '' : ' tickets'}`}</div>` +
      `<div class="effleg"><span><i style="background:#1F7A4D"></i>Closed ${fmt(c)}</span><span><i style="background:#B08D57"></i>${openLbl} ${fmt(o)}</span></div></div>`;
  }).join('');
  const tpct = (tc + to) ? Math.round(tc / (tc + to) * 100) : 0, u = hrs ? '' : ' tickets';
  const ctl = `<div class="effctl"><div class="seg">${E.sprints.map(s => `<button class="segb${s.id === sp.id ? ' on' : ''}" data-eff="sprint:${s.id}">${esc(s.name)}</button>`).join('')}</div>` +
    `<div class="seg"><button class="segb${!hrs ? ' on' : ''}" data-eff="metric:tasks">Tickets</button><button class="segb${hrs ? ' on' : ''}" data-eff="metric:hours">Hours</button></div></div>`;
  const asOf = E.asOf ? (() => { const p = dparts(E.asOf); return `${p.d} ${MON[p.m - 1]} ${p.y}`; })() : '';
  return `<div class="day-head"><h2>Team efficiency: closing tasks</h2><span class="kind Update">${esc(sp.status.toUpperCase())}</span></div>${ctl}` +
    `<div class="effmeta">${esc(sp.name)}, ${esc(sp.dates)}. Share of each person's tickets that were closed. Figures from Jira as of ${asOf}.</div>` +
    `<div class="effteam"><span><b>${tpct}%</b>team closed</span><span>${fmt(tc)}${u} closed</span><span>${fmt(to)}${u} ${sp.id === 's21' ? 'carried to Sprint 22' : 'still open'}</span></div>` +
    `<div class="effgrid">${cards}</div><div class="effnote">${esc(sp.note)}</div>`;
}

/* ---------- date filter ---------- */
function panelHTML() {
  const days = shownDays().reverse(), years = [];
  days.forEach(d => { const p = dparts(d.date); let y = years.find(x => x.y === p.y); if (!y) years.push(y = { y:p.y, months:[] });
    let m = y.months.find(x => x.m === p.m); if (!m) y.months.push(m = { m:p.m, days:[] }); m.days.push({ date:d.date, p }); });
  return `<button class="ddall${active === 'all' ? ' on' : ''}" data-key="all">All dates</button>` +
    years.map(y => `<div class="ddyear">${y.y}</div>` + y.months.map(m => `<div class="ddmonth">${MONFULL[m.m - 1]}</div><div class="ddgrid">` +
      m.days.map(x => `<button class="ddday${active === x.date ? ' on' : ''}" data-key="${x.date}"><b>${x.p.d}</b><span>${WD[x.p.wd].slice(0, 3)}</span></button>`).join('') + `</div>`).join('')).join('');
}
function renderFilter() {
  const isDate = /^\d{4}-/.test(active), lab = $('ddLabel');
  lab.textContent = isDate ? fullShort(active) : active === 'all' ? 'All dates' : 'Select a date';
  lab.classList.toggle('muted', !isDate && active !== 'all');
  $('ddPanel').innerHTML = panelHTML();
  document.querySelectorAll('.pagebtn').forEach(b => b.classList.toggle('on', b.dataset.page === active));
}
function closePanel() { $('ddPanel').hidden = true; $('ddBtn').setAttribute('aria-expanded', 'false'); }
$('ddBtn').addEventListener('click', e => { e.stopPropagation(); const open = $('ddPanel').hidden; $('ddPanel').hidden = !open; $('ddBtn').setAttribute('aria-expanded', String(open)); if (open) { const on = $('ddPanel').querySelector('.on'); if (on) on.scrollIntoView({ block:'nearest' }); } });
document.addEventListener('click', e => {
  const pick = e.target.closest('.ddday, .ddall'); if (pick) { show(pick.dataset.key); closePanel(); return; }
  const pg = e.target.closest('.pagebtn'); if (pg) { show(pg.dataset.page); closePanel(); return; }
  const eb = e.target.closest('button[data-eff]'); if (eb) { const [k, v] = eb.dataset.eff.split(':'); EFF[k] = v; const sec = $('effSection'); if (sec) sec.innerHTML = effInner(); return; }
  if (!e.target.closest('.ddwrap')) closePanel();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

/* ---------- deployments banner ---------- */
function depBannerHTML() {
  const days = shownDays(), d = days[days.length - 1], list = (d && d.deployments) || [];
  if (!list.length) return '';
  const n = new Date(), today = `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`;
  const tag = d.date === today ? 'DEPLOYMENTS TODAY' : 'DEPLOYMENTS MARKED';
  return `<div class="dep" role="region" aria-label="Deployments"><div class="dep-head"><span class="dep-tag">${tag}</span><b>${longDate(d.date)}</b></div><div class="dep-grid">` +
    list.map(x => `<div class="dep-item"><div class="dep-env ${esc(x.env)}">${esc(x.env)}</div><div><div class="dep-title">${linkify(x.item)}</div>` +
      `<div class="dep-meta"><span><b>Owner</b> ${esc(x.owner)}</span>${x.when ? `<span><b>When</b> ${esc(x.when)}</span>` : ''}</div>${x.note ? `<div class="dep-note">${linkify(x.note)}</div>` : ''}</div></div>`).join('') + `</div></div>`;
}

/* ---------- view ---------- */
function fixActive() {
  const days = shownDays(), keys = ['all', 'standing', 'efficiency'].concat(days.map(d => d.date));
  if (!keys.includes(active) || (active === 'efficiency' && !DATA.efficiency)) active = days.length ? days[days.length - 1].date : 'all';
}
function render() {
  fixActive();
  $('depBanner').innerHTML = depBannerHTML();
  $('app').innerHTML = shownDays().map(dayHTML).join('') + standingHTML() + (DATA.efficiency ? `<section class="day" data-key="efficiency" id="effSection">${effInner()}</section>` : '');
  show(active, true);
}
function show(key, quiet) {
  active = key;
  document.querySelectorAll('.day').forEach(sec => { const sk = sec.dataset.key; sec.style.display = ((key === 'all' && sk !== 'efficiency') || sk === key) ? '' : 'none'; });
  const d = DATA.days.find(x => x.date === key);
  $('eyebrow').textContent = d ? longDate(d.date).toUpperCase() : (key === 'standing' ? 'STANDING ITEMS' : key === 'efficiency' ? 'TEAM EFFICIENCY' : 'ALL DATES');
  renderFilter();
  if (!quiet && history.replaceState) history.replaceState(null, '', '#' + key);
}
window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (!k || k === active || !DATA) return; active = k; fixActive(); show(active, true); });

/* ---------- load, refresh ---------- */
async function fetchData() {
  if (location.protocol === 'file:') return null;
  try { const r = await fetch('data.json?_=' + Date.now(), { cache:'no-store' }); return r.ok ? await r.json() : null; } catch (e) { return null; }
}
async function load() { DATA = (await fetchData()) || SEED; DATA.standing = DATA.standing || {}; active = location.hash.slice(1); render(); }
async function poll() { if (document.hidden || !DATA) return; const r = await fetchData(); if (r && r.updated !== DATA.updated) { DATA = r; DATA.standing = DATA.standing || {}; render(); } }
load(); setInterval(poll, 60000); document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });

(function checkForUpdate() {
